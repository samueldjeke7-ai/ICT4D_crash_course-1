<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordeaux Map - Global Floods</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .loading {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">Loading Global Flood Archive...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    
    <!-- SheetJS for XLSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // Set view to Bordeaux city center
        var map = L.map('map').setView([44.8378, -0.5792], 2);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Create a MarkerClusterGroup to hold all flood points
        var markers = L.markerClusterGroup();

        // Define a reflectMap to map internal fields to Excel headers
        const reflectMap = {
            country: 'Country',
            cause: 'MainCause',
            began: 'Began',
            ended: 'Ended',
            fatalities: 'Dead',
            displaced: 'Displaced',
            lat: 'lat',
            long: 'long'
        };

        // Fetch and process the local floodarchive.xlsx
        fetch('floodarchive.xlsx')
            .then(response => response.arrayBuffer())
            .then(data => {
                var workbook = XLSX.read(data, { type: 'array' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];
                var results = XLSX.utils.sheet_to_json(worksheet);

                console.log("Found " + results.length + " flood events.");
                
                results.forEach(function(row) {
                    // Use the reflectMap to extract values from the Excel row
                    const item = {
                        country: row[reflectMap.country],
                        cause: row[reflectMap.cause] || 'N/A',
                        began: row[reflectMap.began],
                        ended: row[reflectMap.ended],
                        fatalities: row[reflectMap.fatalities] || 0,
                        displaced: row[reflectMap.displaced] || 0,
                        lat: row[reflectMap.lat],
                        long: row[reflectMap.long]
                    };

                    if (item.lat && item.long) {
                        var marker = L.marker([item.lat, item.long])
                            .bindPopup(`
                                <b>Location:</b> ${item.country}<br>
                                <b>Cause:</b> ${item.cause}<br>
                                <b>Began:</b> ${item.began}<br>
                                <b>Ended:</b> ${item.ended}<br>
                                <b>Fatalities:</b> ${item.fatalities}<br>
                                <b>Displaced:</b> ${item.displaced}
                            `);
                        markers.addLayer(marker);
                    }
                });

                map.addLayer(markers);
                document.getElementById('loading').style.display = 'none';
            })
            .catch(err => {
                console.error("Error loading Excel:", err);
                document.getElementById('loading').innerText = "Error loading data.";
            });
    </script>
</body>
</html>
