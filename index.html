<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordeaux Map - Global Floods</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .loading {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">Loading Global Flood Archive...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // Set view to Bordeaux city center
        var map = L.map('map').setView([44.8378, -0.5792], 6);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Add a primary marker for Bordeaux
        L.marker([44.8378, -0.5792]).addTo(map)
            .bindPopup('Bordeaux, France')
            .openPopup();

        // Create a MarkerClusterGroup to hold all flood points
        var markers = L.markerClusterGroup();

        // Fetch the Global Flood Archive CSV (hosted version)
        var csvUrl = 'https://raw.githubusercontent.com/sparklabnyc/usa_floods_mortality_2024/main/01_data/1a_exposure_data/FloodArchive.csv';

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                console.log("Found " + results.data.length + " flood events.");
                
                results.data.forEach(function(row) {
                    if (row.lat && row.long) {
                        var marker = L.marker([row.lat, row.long])
                            .bindPopup(`
                                <b>Location:</b> ${row.Country}<br>
                                <b>Cause:</b> ${row.MainCause || 'N/A'}<br>
                                <b>Began:</b> ${row.Began}<br>
                                <b>Ended:</b> ${row.Ended}<br>
                                <b>Fatalities:</b> ${row.Dead || 0}<br>
                                <b>Displaced:</b> ${row.Displaced || 0}
                            `);
                        markers.addLayer(marker);
                    }
                });

                map.addLayer(markers);
                document.getElementById('loading').style.display = 'none';
            },
            error: function(err) {
                console.error("Error loading CSV:", err);
                document.getElementById('loading').innerText = "Error loading data.";
            }
        });
    </script>
</body>
</html>
